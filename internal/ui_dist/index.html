<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workflow Admin</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #18202f;
      --muted: #647086;
      --line: #d9dee8;
      --accent: #0f766e;
      --accent-ink: #ffffff;
      --warn: #9a3412;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .shell {
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
      min-height: 100vh;
    }
    aside {
      border-right: 1px solid var(--line);
      background: #101827;
      color: #eef3fb;
      padding: 20px 16px;
    }
    .brand {
      display: grid;
      gap: 4px;
      margin-bottom: 24px;
    }
    .brand strong { font-size: 18px; }
    .brand span { color: #aeb9ca; font-size: 13px; }
    nav {
      display: grid;
      gap: 8px;
    }
    .nav-section {
      margin-top: 14px;
      color: #aeb9ca;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    button.nav-item {
      width: 100%;
      min-height: 40px;
      border: 0;
      border-radius: 6px;
      padding: 9px 10px;
      color: #eef3fb;
      background: transparent;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }
    button.nav-item:hover,
    button.nav-item.active {
      background: rgba(255, 255, 255, .12);
    }
    main {
      min-width: 0;
      padding: 24px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }
    .status {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      background: var(--panel);
      color: var(--muted);
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .card, .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .card {
      padding: 16px;
      min-height: 108px;
    }
    .card span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
    }
    .card strong {
      font-size: 28px;
      line-height: 1;
    }
    .panel {
      display: none;
      padding: 18px;
    }
    .panel.active { display: block; }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .table th, .table td {
      border-top: 1px solid var(--line);
      padding: 10px 8px;
      text-align: left;
      vertical-align: top;
    }
    .table th { color: var(--muted); font-weight: 600; }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 2px 8px;
      background: #e6f4f1;
      color: #0f766e;
      font-size: 12px;
      font-weight: 700;
    }
    .empty, .warn {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 16px;
      color: var(--muted);
      background: #fbfcfd;
    }
    .warn { color: var(--warn); }
    .surface-frame {
      width: 100%;
      min-height: 680px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .surface-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }
    .surface-actions a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      aside { position: static; }
      .grid { grid-template-columns: 1fr; }
      header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="shell" data-admin-shell-version="1" data-contributions-endpoint="/api/admin/contributions">
    <aside>
      <div class="brand">
        <strong>Workflow Admin</strong>
        <span id="target-app-label">Application control plane</span>
      </div>
      <nav>
        <div class="nav-section">Core</div>
        <button class="nav-item active" type="button" data-panel="overview-panel">Overview</button>
        <div class="nav-section" id="contribution-nav-heading">Surfaces</div>
        <div id="contribution-nav"></div>
      </nav>
    </aside>
    <main>
      <header>
        <h1 id="panel-title">Overview</h1>
        <div class="status" id="load-status">Loading contributions</div>
      </header>

      <section class="grid" aria-label="Admin status">
        <div class="card"><span>Registered surfaces</span><strong id="surface-count">0</strong></div>
        <div class="card"><span>Categories</span><strong id="category-count">0</strong></div>
        <div class="card"><span>Active surface</span><strong id="active-surface">Overview</strong></div>
      </section>

      <section id="overview-panel" class="panel active">
        <h2>Admin Overview</h2>
        <div id="overview-content" class="empty">No registered admin surfaces loaded.</div>
      </section>

      <section id="contributions-panel" class="panel">
        <h2>Contributions</h2>
        <div id="contribution-list" class="empty">No contributed admin surfaces loaded.</div>
      </section>
    </main>
  </div>

  <script>
    const shell = document.querySelector('.shell');
    const status = document.getElementById('load-status');
    const title = document.getElementById('panel-title');
    const nav = document.getElementById('contribution-nav');
    const navHeading = document.getElementById('contribution-nav-heading');
    const list = document.getElementById('contribution-list');
    const overviewContent = document.getElementById('overview-content');
    const surfaceCount = document.getElementById('surface-count');
    const categoryCount = document.getElementById('category-count');
    const activeSurface = document.getElementById('active-surface');

    function showPanel(id, label) {
      document.querySelectorAll('.panel').forEach(panel => panel.classList.toggle('active', panel.id === id));
      document.querySelectorAll('.nav-item').forEach(item => item.classList.toggle('active', item.dataset.panel === id));
      title.textContent = label;
      activeSurface.textContent = label;
    }

    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => showPanel(item.dataset.panel, item.textContent.trim()));
    });

    function renderContributions(contributions) {
      nav.textContent = '';
      surfaceCount.textContent = String(contributions.length);
      const categories = Array.from(new Set(contributions.map(surface => surface.category || 'plugin')));
      categoryCount.textContent = String(categories.length);
      navHeading.hidden = contributions.length === 0;
      if (!contributions.length) {
        list.className = 'empty';
        list.textContent = 'No registered admin surfaces loaded.';
        overviewContent.className = 'empty';
        overviewContent.textContent = 'No registered admin surfaces loaded.';
        return;
      }

      categories.forEach(category => {
        const section = document.createElement('div');
        section.className = 'nav-section';
        section.textContent = category;
        nav.appendChild(section);

        contributions
          .filter(surface => (surface.category || 'plugin') === category)
          .forEach(surface => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'nav-item';
            button.dataset.panel = 'contributions-panel';
            button.textContent = surface.title || surface.id || surface.path || 'Untitled surface';
            button.addEventListener('click', () => openContribution(surface));
            nav.appendChild(button);
          });
      });

      const table = document.createElement('table');
      table.className = 'table';
      const head = document.createElement('thead');
      const headRow = document.createElement('tr');
      ['Title', 'Path', 'Mode', 'Category'].forEach(label => appendTableCell(headRow, 'th', label));
      head.appendChild(headRow);
      table.appendChild(head);
      const body = document.createElement('tbody');
      contributions.forEach(surface => {
        const row = document.createElement('tr');
        appendTableCell(row, 'td', surface.title || surface.id || '');
        appendTableCell(row, 'td', surface.path || '');
        appendTableCell(row, 'td', surface.render_mode || 'internal');
        appendTableCell(row, 'td', surface.category || 'plugin');
        body.appendChild(row);
      });
      table.appendChild(body);
      list.className = '';
      list.replaceChildren(table);
      overviewContent.className = '';
      overviewContent.replaceChildren(table.cloneNode(true));
    }

    function appendTableCell(row, cellType, value) {
      const cell = document.createElement(cellType);
      cell.appendChild(document.createTextNode(String(value)));
      row.appendChild(cell);
      return cell;
    }

    function openContribution(surface) {
      showPanel('contributions-panel', surface.title || surface.id || 'Contribution');
      if (surface.render_mode === 'iframe' || surface.render_mode === 'asset') {
        const frame = document.createElement('iframe');
        frame.className = 'surface-frame';
        frame.src = surface.path;
        frame.title = surface.title || surface.id || 'Admin surface';
        const actions = document.createElement('div');
        actions.className = 'surface-actions';
        const link = document.createElement('a');
        link.href = surface.path;
        link.target = '_blank';
        link.rel = 'noreferrer';
        link.textContent = 'Open full screen';
        actions.appendChild(link);
        list.className = '';
        list.replaceChildren(actions, frame);
        return;
      }
      const details = document.createElement('div');
      details.className = 'empty';
      details.textContent = surface.path || '(no path)';
      list.className = '';
      list.replaceChildren(details);
    }

    async function loadContributions() {
      try {
        const response = await fetch(shell.dataset.contributionsEndpoint, { headers: { accept: 'application/json' } });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        renderContributions(payload.contributions || []);
        status.textContent = 'Contributions loaded';
      } catch (error) {
        renderContributions([]);
        status.textContent = 'Offline fallback';
      }
    }

    loadContributions();
  </script>
</body>
</html>
