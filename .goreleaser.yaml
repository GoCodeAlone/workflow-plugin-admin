version: 2

before:
  hooks:
    - go mod tidy
    - "sed -i.bak 's/\"version\": \".*\"/\"version\": \"{{ .Version }}\"/' plugin.json && rm -f plugin.json.bak"

builds:
  - id: workflow-plugin-admin
    main: ./cmd/workflow-plugin-admin
    binary: workflow-plugin-admin
    env:
      - CGO_ENABLED=0
    ldflags:
      - "-s -w -X github.com/GoCodeAlone/workflow-plugin-admin/internal.Version={{.Version}}"
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    files:
      - plugin.json

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc

release:
  draft: true
