<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workflow Admin</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #18202f;
      --muted: #647086;
      --line: #d9dee8;
      --accent: #0f766e;
      --accent-ink: #ffffff;
      --warn: #9a3412;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .shell {
      display: grid;
      grid-template-columns: minmax(220px, 280px) minmax(0, 1fr);
      min-height: 100vh;
    }
    aside {
      border-right: 1px solid var(--line);
      background: #101827;
      color: #eef3fb;
      padding: 20px 16px;
    }
    .brand {
      display: grid;
      gap: 4px;
      margin-bottom: 24px;
    }
    .brand strong { font-size: 18px; }
    .brand span { color: #aeb9ca; font-size: 13px; }
    nav {
      display: grid;
      gap: 8px;
    }
    .nav-section {
      margin-top: 14px;
      color: #aeb9ca;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }
    button.nav-item {
      width: 100%;
      min-height: 40px;
      border: 0;
      border-radius: 6px;
      padding: 9px 10px;
      color: #eef3fb;
      background: transparent;
      text-align: left;
      font: inherit;
      cursor: pointer;
    }
    button.nav-item:hover,
    button.nav-item.active {
      background: rgba(255, 255, 255, .12);
    }
    main {
      min-width: 0;
      padding: 24px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }
    .status {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      background: var(--panel);
      color: var(--muted);
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .card, .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .card {
      padding: 16px;
      min-height: 108px;
    }
    .card span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
    }
    .card strong {
      font-size: 28px;
      line-height: 1;
    }
    .panel {
      display: none;
      padding: 18px;
    }
    .panel.active { display: block; }
    .panel h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .table th, .table td {
      border-top: 1px solid var(--line);
      padding: 10px 8px;
      text-align: left;
      vertical-align: top;
    }
    .table th { color: var(--muted); font-weight: 600; }
    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 2px 8px;
      background: #e6f4f1;
      color: #0f766e;
      font-size: 12px;
      font-weight: 700;
    }
    .empty, .warn {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 16px;
      color: var(--muted);
      background: #fbfcfd;
    }
    .warn { color: var(--warn); }
    .surface-frame {
      width: 100%;
      min-height: 680px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }
    .surface-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }
    .surface-actions a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
    .config-form {
      display: grid;
      gap: 16px;
    }
    .config-group {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      background: #fbfcfd;
    }
    .config-group h3 {
      margin: 0 0 4px;
      font-size: 16px;
    }
    .config-group p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
    }
    .config-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 12px;
    }
    .config-control {
      display: grid;
      gap: 6px;
    }
    .config-control label {
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
    }
    .config-control small {
      color: var(--muted);
      line-height: 1.4;
    }
    .config-control input,
    .config-control select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--ink);
      font: inherit;
      background: #fff;
    }
    .config-control input[type="checkbox"] {
      width: auto;
      min-height: auto;
      justify-self: start;
    }
    .config-result {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #f8fafc;
      white-space: pre-wrap;
      font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: var(--muted);
    }
    .hidden { display: none !important; }
    .login-panel {
      max-width: 420px;
    }
    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 12px;
    }
    .field label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .field input {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      color: var(--ink);
      font: inherit;
      background: #fff;
    }
    .primary-button,
    .secondary-button {
      min-height: 36px;
      border-radius: 6px;
      padding: 8px 12px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .primary-button {
      border: 1px solid var(--accent);
      color: var(--accent-ink);
      background: var(--accent);
    }
    .secondary-button {
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--panel);
    }
    .button-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      aside { position: static; }
      .grid { grid-template-columns: 1fr; }
      header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="shell" data-admin-shell-version="1" data-contributions-endpoint="/api/admin/contributions" data-login-endpoint="/api/admin/auth/login" data-token-storage-key="workflow.admin.token">
    <aside>
      <div class="brand">
        <strong>Workflow Admin</strong>
        <span id="target-app-label">Application control plane</span>
      </div>
      <nav id="admin-nav">
        <div class="nav-section">Core</div>
        <button class="nav-item active" type="button" data-panel="overview-panel">Overview</button>
        <div class="nav-section" id="contribution-nav-heading">Admin tools</div>
        <div id="contribution-nav"></div>
      </nav>
    </aside>
    <main>
      <header>
        <h1 id="panel-title">Overview</h1>
        <div class="status" id="load-status">Checking session</div>
      </header>

      <section id="login-panel" class="panel active login-panel">
        <h2>Sign In</h2>
        <form id="login-form" autocomplete="on">
          <div class="field">
            <label for="admin-email">Email</label>
            <input id="admin-email" name="email" type="email" autocomplete="username" required>
          </div>
          <div class="field">
            <label for="admin-password">Password</label>
            <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <div class="button-row">
            <button class="primary-button" type="submit">Sign in</button>
            <span id="login-error" class="warn hidden"></span>
          </div>
        </form>
      </section>

      <section class="grid hidden" id="admin-status-grid" aria-label="Admin status">
        <div class="card"><span>Management pages</span><strong id="surface-count">0</strong></div>
        <div class="card"><span>Categories</span><strong id="category-count">0</strong></div>
        <div class="card"><span>Active tool</span><strong id="active-surface">Overview</strong></div>
      </section>

      <section id="overview-panel" class="panel active">
        <h2>Admin Overview</h2>
        <div id="overview-content" class="empty">No admin tools loaded.</div>
      </section>

      <section id="contributions-panel" class="panel">
        <h2>Management pages</h2>
        <div id="contribution-list" class="empty">No admin tools loaded.</div>
      </section>
    </main>
  </div>

  <script>
    const shell = document.querySelector('.shell');
    const status = document.getElementById('load-status');
    const title = document.getElementById('panel-title');
    const adminNav = document.getElementById('admin-nav');
    const nav = document.getElementById('contribution-nav');
    const navHeading = document.getElementById('contribution-nav-heading');
    const list = document.getElementById('contribution-list');
    const overviewContent = document.getElementById('overview-content');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const statusGrid = document.getElementById('admin-status-grid');
    const surfaceCount = document.getElementById('surface-count');
    const categoryCount = document.getElementById('category-count');
    const activeSurface = document.getElementById('active-surface');
    const tokenStorageKey = shell.dataset.tokenStorageKey || 'workflow.admin.token';
    const adminToolFrames = new WeakMap();
    let currentGrantedScopes = [];

    function storedToken() {
      try {
        return window.localStorage.getItem(tokenStorageKey) || '';
      } catch (_) {
        return '';
      }
    }

    function storeToken(token) {
      try {
        window.localStorage.setItem(tokenStorageKey, token);
      } catch (_) {
        // Storage can be unavailable in private or embedded contexts.
      }
    }

    function clearToken() {
      try {
        window.localStorage.removeItem(tokenStorageKey);
      } catch (_) {
        // Storage can be unavailable in private or embedded contexts.
      }
    }

    function authHeaders(extra = {}) {
      const token = storedToken();
      const headers = { ...extra };
      if (token) headers.Authorization = `Bearer ${token}`;
      return headers;
    }

    function isAllowedAdminToolSource(sourceWindow) {
      if (!sourceWindow) return false;
      for (const frame of document.querySelectorAll('iframe.surface-frame')) {
        try {
          const framePath = new URL(frame.src, window.location.origin).pathname;
          if (frame.contentWindow === sourceWindow && framePath.startsWith('/admin')) return true;
        } catch (_) {
          // Ignore malformed frame sources.
        }
      }
      return false;
    }

    function adminToolGrants(sourceWindow) {
      const surface = adminToolFrames.get(sourceWindow);
      if (surface && Array.isArray(surface.grantedScopes)) return surface.grantedScopes;
      if (currentGrantedScopes.length) return currentGrantedScopes;
      if (!surface || !Array.isArray(surface.permissions)) return [];
      return surface.permissions
        .map(permission => permission && permission.permission)
        .filter(permission => typeof permission === 'string' && permission);
    }

    window.addEventListener('message', event => {
      const message = event.data || {};
      if (message.type !== 'workflow.admin.auth.request') return;
      if (event.origin !== window.location.origin) return;
      if (!isAllowedAdminToolSource(event.source)) return;
      event.source.postMessage({
        type: 'workflow.admin.auth.response',
        requestId: message.requestId || '',
        token: storedToken(),
        grantedScopes: adminToolGrants(event.source)
      }, event.origin);
    });

    function showPanel(id, label, selectedItem = null) {
      document.querySelectorAll('.panel').forEach(panel => panel.classList.toggle('active', panel.id === id));
      document.querySelectorAll('.nav-item').forEach(item => {
        const active = selectedItem ? item === selectedItem : item.dataset.panel === id;
        item.classList.toggle('active', active);
      });
      title.textContent = label;
      activeSurface.textContent = label;
    }

    function showLogin(message = '') {
      clearToken();
      statusGrid.classList.add('hidden');
      adminNav.classList.add('hidden');
      nav.textContent = '';
      navHeading.hidden = true;
      document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
      document.getElementById('login-panel').classList.add('active');
      title.textContent = 'Sign In';
      status.textContent = 'Sign in required';
      loginError.textContent = message;
      loginError.classList.toggle('hidden', !message);
    }

    function showAdminShell() {
      statusGrid.classList.remove('hidden');
      adminNav.classList.remove('hidden');
      document.getElementById('login-panel').classList.remove('active');
      showPanel('overview-panel', 'Overview');
    }

    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => showPanel(item.dataset.panel, item.textContent.trim()));
    });

    function renderAdminTools(contributions, grantedScopes = []) {
      nav.textContent = '';
      const fallbackScopes = contributions.flatMap(surface => {
        const permissions = Array.isArray(surface.permissions) ? surface.permissions : [];
        return permissions.map(permission => permission && permission.permission).filter(Boolean);
      });
      currentGrantedScopes = Array.from(new Set((grantedScopes.length ? grantedScopes : fallbackScopes).filter(Boolean)));
      contributions.forEach(surface => {
        surface.grantedScopes = currentGrantedScopes;
      });
      surfaceCount.textContent = String(contributions.length);
      const categories = Array.from(new Set(contributions.map(surface => surface.category || 'plugin')));
      categoryCount.textContent = String(categories.length);
      navHeading.hidden = contributions.length === 0;
      if (!contributions.length) {
        list.className = 'empty';
        list.textContent = 'No admin tools loaded.';
        overviewContent.className = 'empty';
        overviewContent.textContent = 'No admin tools loaded.';
        return;
      }

      categories.forEach(category => {
        const section = document.createElement('div');
        section.className = 'nav-section';
        section.textContent = category;
        nav.appendChild(section);

        contributions
          .filter(surface => (surface.category || 'plugin') === category)
          .forEach(surface => {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'nav-item';
            button.dataset.panel = 'contributions-panel';
            button.textContent = surface.title || surface.id || surface.path || 'Untitled surface';
            button.addEventListener('click', () => openContribution(surface, button));
            nav.appendChild(button);
          });
      });

      const table = document.createElement('table');
      table.className = 'table';
      const head = document.createElement('thead');
      const headRow = document.createElement('tr');
      ['Title', 'Path', 'Mode', 'Category'].forEach(label => appendTableCell(headRow, 'th', label));
      head.appendChild(headRow);
      table.appendChild(head);
      const body = document.createElement('tbody');
      contributions.forEach(surface => {
        const row = document.createElement('tr');
        appendTableCell(row, 'td', surface.title || surface.id || '');
        appendTableCell(row, 'td', surface.path || '');
        appendTableCell(row, 'td', surface.render_mode || 'internal');
        appendTableCell(row, 'td', surface.category || 'plugin');
        body.appendChild(row);
      });
      table.appendChild(body);
      list.className = '';
      list.replaceChildren(table);
      overviewContent.className = '';
      overviewContent.replaceChildren(table.cloneNode(true));
    }

    function appendTableCell(row, cellType, value) {
      const cell = document.createElement(cellType);
      cell.appendChild(document.createTextNode(String(value)));
      row.appendChild(cell);
      return cell;
    }

    async function fetchConfigDescription(surface) {
      const metadata = surface.metadata || {};
      const describePath = metadata.describe_path || surface.path;
      const response = await fetch(describePath, { headers: authHeaders({ accept: 'application/json' }) });
      if (response.status === 401 || response.status === 403) throw new Error('Not authorized');
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    function renderConfigForm(surface, description) {
      const metadata = surface.metadata || {};
      const form = document.createElement('form');
      form.className = 'config-form';
      const draft = { ...(description.effective_config || {}) };
      const groups = Array.isArray(description.groups) ? description.groups : [];

      groups.forEach(group => {
        const section = document.createElement('section');
        section.className = 'config-group';
        const heading = document.createElement('h3');
        heading.appendChild(document.createTextNode(group.label || group.key || 'Configuration'));
        section.appendChild(heading);
        if (group.description) {
          const desc = document.createElement('p');
          desc.appendChild(document.createTextNode(group.description));
          section.appendChild(desc);
        }
        const controls = document.createElement('div');
        controls.className = 'config-controls';
        (group.controls || []).forEach(control => {
          const wrapper = document.createElement('div');
          wrapper.className = 'config-control';
          const id = `config-${surface.id || 'tool'}-${control.key}`;
          const label = document.createElement('label');
          label.htmlFor = id;
          label.appendChild(document.createTextNode(control.label || control.key));
          wrapper.appendChild(label);

          let input;
          if (control.input_type === 'toggle') {
            input = document.createElement('input');
            input.type = 'checkbox';
            input.checked = Boolean(draft[control.config_key || control.key]);
          } else if (Array.isArray(control.options) && control.options.length > 0) {
            input = document.createElement('select');
            control.options.forEach(option => {
              const opt = document.createElement('option');
              opt.value = option.value || '';
              opt.textContent = option.label || option.value || '';
              input.appendChild(opt);
            });
            input.value = String(draft[control.config_key || control.key] || '');
          } else {
            input = document.createElement('input');
            input.type = control.input_type === 'secret' ? 'password' : (control.input_type || 'text');
            input.value = control.secret ? '' : String(draft[control.config_key || control.key] || '');
          }
          input.id = id;
          input.disabled = control.enabled === false;
          input.title = control.help_text || control.description || '';
          input.addEventListener('change', () => {
            const key = control.config_key || control.key;
            draft[key] = input.type === 'checkbox' ? input.checked : input.value;
          });
          wrapper.appendChild(input);

          const help = document.createElement('small');
          help.appendChild(document.createTextNode(control.disabled_reason || control.help_text || control.description || ''));
          wrapper.appendChild(help);
          controls.appendChild(wrapper);
        });
        section.appendChild(controls);
        form.appendChild(section);
      });

      const actions = document.createElement('div');
      actions.className = 'button-row';
      const validate = document.createElement('button');
      validate.type = 'button';
      validate.className = 'primary-button';
      validate.textContent = 'Validate changes';
      actions.appendChild(validate);
      form.appendChild(actions);

      const result = document.createElement('pre');
      result.className = 'config-result';
      result.textContent = 'Loaded from plugin configuration contract.';
      form.appendChild(result);

      validate.addEventListener('click', async () => {
        const validatePath = metadata.validate_path;
        if (!validatePath) {
          result.textContent = 'This admin tool did not provide a validation endpoint.';
          return;
        }
        const response = await fetch(validatePath, {
          method: 'POST',
          headers: authHeaders({ accept: 'application/json', 'content-type': 'application/json' }),
          body: JSON.stringify({ desired_config: draft })
        });
        result.textContent = JSON.stringify(await response.json(), null, 2);
      });

      list.className = '';
      list.replaceChildren(form);
    }

    function openContribution(surface, selectedItem = null) {
      showPanel('contributions-panel', surface.title || surface.id || 'Contribution', selectedItem);
      if (surface.render_mode === 'config-form') {
        list.className = 'empty';
        list.textContent = 'Loading configuration...';
        fetchConfigDescription(surface)
          .then(description => renderConfigForm(surface, description))
          .catch(error => {
            list.className = 'warn';
            list.textContent = error.message || 'Unable to load configuration.';
          });
        return;
      }
      if (surface.render_mode === 'iframe' || surface.render_mode === 'asset') {
        const frame = document.createElement('iframe');
        frame.className = 'surface-frame';
        frame.src = surface.path;
        frame.title = surface.title || surface.id || 'Admin surface';
        const actions = document.createElement('div');
        actions.className = 'surface-actions';
        const link = document.createElement('a');
        link.href = surface.path;
        link.target = '_blank';
        link.rel = 'noreferrer';
        link.textContent = 'Open full screen';
        actions.appendChild(link);
        list.className = '';
        list.replaceChildren(actions, frame);
        if (frame.contentWindow) adminToolFrames.set(frame.contentWindow, surface);
        return;
      }
      const details = document.createElement('div');
      details.className = 'empty';
      details.textContent = surface.path || '(no path)';
      list.className = '';
      list.replaceChildren(details);
    }

    async function loadAdminTools() {
      if (!storedToken()) {
        showLogin();
        return;
      }
      showAdminShell();
      try {
        const response = await fetch(shell.dataset.contributionsEndpoint, { headers: authHeaders({ accept: 'application/json' }) });
        if (response.status === 401 || response.status === 403) {
          showLogin('Your session is not authorized for this admin.');
          return;
        }
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        renderAdminTools(payload.contributions || [], payload.granted_permissions || payload.grantedPermissions || []);
        status.textContent = 'Admin tools loaded';
      } catch (error) {
        renderAdminTools([], []);
        status.textContent = 'Offline fallback';
      }
    }

    loginForm.addEventListener('submit', async event => {
      event.preventDefault();
      loginError.classList.add('hidden');
      status.textContent = 'Signing in';
      const form = new FormData(loginForm);
      try {
        const response = await fetch(shell.dataset.loginEndpoint, {
          method: 'POST',
          headers: { 'content-type': 'application/json', accept: 'application/json' },
          body: JSON.stringify({
            email: String(form.get('email') || ''),
            password: String(form.get('password') || '')
          })
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        const token = payload.token || payload.access_token;
        if (!token) throw new Error('missing token');
        storeToken(token);
        loginForm.reset();
        await loadAdminTools();
      } catch (error) {
        showLogin('Sign-in failed.');
      }
    });

    loadAdminTools();
  </script>
</body>
</html>
